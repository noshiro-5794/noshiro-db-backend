services:
  postgres:
    image: postgres:15.18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noshiro_db}
      POSTGRES_USER: ${POSTGRES_USER:-noshiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noshiro} -d ${POSTGRES_DB:-noshiro_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${NOSHIRO_DATA_ROOT:-./.docker-data}/postgres:/var/lib/postgresql/data
    networks:
      - noshiro_net

  redis-broker:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BROKER_BIND_ADDRESS:-127.0.0.1}:${REDIS_BROKER_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - ${NOSHIRO_DATA_ROOT:-./.docker-data}/redis-broker:/data
    networks:
      - noshiro_net

  redis-cache:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_CACHE_BIND_ADDRESS:-127.0.0.1}:${REDIS_CACHE_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - ${NOSHIRO_DATA_ROOT:-./.docker-data}/redis-cache:/data
    networks:
      - noshiro_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${NOSHIRO_DATA_ROOT:-./.docker-data}/minio:/data
    networks:
      - noshiro_net

networks:
  noshiro_net:
    name: noshiro_net
