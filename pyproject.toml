[project]
name = "noshiro-db-backend"
version = "0.1.0"
description = "Django REST backend for the Noshiro DB catalog and community."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Noshiro_5794", email = "hangyuan2005@gmail.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "cachetools>=7,<8",
    "celery[redis]>=5.6,<6",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9,<5",
    "django-environ>=0.11,<1",
    "django-filter>=25,<26",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "gunicorn>=23,<24",
    "httpx>=0.28,<0.29",
    "minio>=7.2,<8",
    "mcp>=1.13,<2",
    "pillow>=12,<13",
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "resend>=2.28,<3",
    "sentry-sdk[celery,django]>=2.50,<3",
    "sqlparse>=0.6,<0.7",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "diff-cover>=10,<11",
    "django-stubs>=5.2,<6",
    "djangorestframework-stubs>=3.16,<4",
    "mypy>=1.17,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "pytest-django>=4.10,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
required-version = ">=0.11.31,<0.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--reuse-db", "--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/manage.py",
    "src/config/asgi.py",
    "src/config/wsgi.py",
    "src/config/celery.py",
    "src/config/mcp_internal.py",
    "src/config/mcp_public.py",
    "src/config/settings/local.py",
    "src/config/settings/production.py",
    "src/config/settings/test.py",
    "src/config/settings/environment.py",
    "src/integrations/mcp/__init__.py",
    "src/integrations/mcp/django_setup.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403", "F405"]
